<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Static metadata: link crawlers do not execute the app. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="DecentInvoice">
    <meta property="og:title" content="Decent Invoice">
    <meta property="og:description" content="DecentInvoice: explore the public project website.">
    <meta property="og:url" content="https://thejollylama.github.io/DecentInvoice/">
    <meta property="og:image" content="https://thejollylama.github.io/DecentInvoice/assets/social-preview.jpg">
    <meta property="og:image:secure_url" content="https://thejollylama.github.io/DecentInvoice/assets/social-preview.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="DecentInvoice website preview">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Decent Invoice">
    <meta name="twitter:description" content="DecentInvoice: explore the public project website.">
    <meta name="twitter:image" content="https://thejollylama.github.io/DecentInvoice/assets/social-preview.jpg">
    <meta name="twitter:image:alt" content="DecentInvoice website preview">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decent Invoice</title>
  <link rel="icon" href="./img/favicon.png" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/timeline.css" />
  <!-- Ethers.js for Web3 functionality -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body>
  <decent-header></decent-header>
  <script type="module" src="./decent-head.js"></script>
  <!-- Header -->
  <header class="header" hidden style="display:none">
    <div class="centered-title">
      <div class="title">
        <img src="./img/favicon.png" alt="favicon" class="favicon">
        <h1>- ⸬ - Decent ☂ Invoice - ⸬ -</h1>
        <img src="./img/favicon.png" alt="favicon" class="favicon">
      </div>
      <div class="wallet-display" id="account">
        <span id="wallet-address-start">0x0000</span>
        <span class="icons">
          <img src="./img/Eth.gif" class="icon" />
          <img src="./img/favicon.png" class="icon" />
          <img src="./img/SecretPyramid.png" class="icon" />
          <img src="./img/favicon.png" class="icon" />
          <img src="./img/Eth.gif" class="icon" />
        </span>
        <span id="wallet-address-end">0000</span>
      </div>
    </div>
    <button id="connect-wallet" class="wallet-button disconnected">
      <img src="./img/metamask.png" alt="MetaMask" />
    </button>
  </header>

  <!-- Main Content -->
  <div class="content">
    <p id="legacy-status" role="status">Legacy contract unavailable: unverified deployment chain. Use the default workspace.</p>
    <p><a href="./default/index.html">Open the default invoice workspace</a></p>
    <!-- Owner-only form -->
    <div id="invoice-form-section" class="hidden">
      <h2>Create Invoice</h2>
      <form id="createInvoiceForm">
        <label for="client">Client Address:</label>
        <input type="text" id="client" required />

        <label for="token">Token Address:</label>
        <input type="text" id="token" required />

        <label for="amount">Amount (in smallest unit):</label>
        <input type="number" id="amount" required />

        <label for="expiry">Expiry (UNIX timestamp):</label>
        <input type="number" id="expiry" required />

        <label for="issueUrl">GitHub Issue URL:</label>
        <input type="text" id="issueUrl" required />

        <label for="previewCid">Preview IPFS CID (video demo):</label>
        <input type="text" id="previewCid" />

        <label for="solutionCid">Solution IPFS CID:</label>
        <input type="text" id="solutionCid" />

        <button type="submit">Submit Invoice</button>
      </form>
      <div id="createResult" class="message"></div>
    </div>

    <!-- Timeline -->
    <h2 class="timeline-title">Open Invoices</h2>
    <div class="timeline-container" id="timeline-container">
      <!-- Cards injected here -->
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div id="contract-address-display"></div>
  </div>

  <!-- JS Entry -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
